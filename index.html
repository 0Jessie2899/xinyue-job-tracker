<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#6d4a86" />
  <title>Jessie的求职之旅</title>
  <meta name="description" content="个人秋招投递、进度与面试准备台账" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <section class="cover" id="cover" aria-label="Jessie的求职之旅封面">
    <div class="cover-haze"></div>
    <img class="cover-iris" src="./assets/iris-flower.webp" alt="" aria-hidden="true" />
    <div class="cover-panel">
      <span class="cover-mark">J</span>
      <p>2027 CAMPUS RECRUITMENT</p>
      <h1>Jessie的求职之旅</h1>
      <div class="cover-line"></div>
      <button class="cover-cta" id="enterTracker" type="button">开启旅程 <span aria-hidden="true">→</span></button>
    </div>
  </section>

  <div class="shell">
    <img class="ambient-iris" src="./assets/iris-flower.webp" alt="" aria-hidden="true" />
    <aside class="sidebar" id="sidebar">
      <div class="brand"><span>J</span><div><b>Jessie求职台账</b><small>JOB JOURNEY</small></div></div>
      <nav id="nav">
        <button class="active" data-page="dashboard"><i>01</i><span>求职看板</span></button>
        <button data-page="applied"><i>02</i><span>投递记录</span></button>
        <button data-page="wishlist"><i>03</i><span>待投递</span></button>
        <button data-page="prep"><i>04</i><span>面试准备</span></button>
      </nav>
    </aside>

    <main>
      <header class="topbar">
        <button class="menu-button" id="menuButton" aria-label="打开菜单">☰</button>
        <h1 id="pageTitle">求职看板</h1>
        <div class="profile"><span>J</span><div><b>Jessie</b><small>个人求职空间</small></div></div>
      </header>
      <div id="notice" class="notice" hidden aria-live="polite"></div>
      <div id="app" class="content"><div class="loading">正在加载台账数据…</div></div>
    </main>
  </div>

  <nav class="bottom-nav" id="bottomNav">
    <button class="active" data-page="dashboard"><i>01</i><span>看板</span></button>
    <button data-page="applied"><i>02</i><span>投递</span></button>
    <button data-page="wishlist"><i>03</i><span>待投</span></button>
    <button data-page="prep"><i>04</i><span>准备</span></button>
  </nav>

  <div class="modal" id="jobModal" hidden>
    <button class="backdrop" data-close="jobModal" aria-label="关闭"></button>
    <section class="drawer" role="dialog" aria-modal="true" aria-labelledby="jobModalTitle">
      <header><div><small id="jobModalKicker">JOB RECORD</small><h2 id="jobModalTitle">新增投递</h2></div><button class="icon" data-close="jobModal" aria-label="关闭">×</button></header>
      <form id="jobForm">
        <div class="form-scroll">
          <input type="hidden" id="jobId" />
          <div class="form-grid">
            <label><span>公司名称 <b>*</b></span><input id="company" required placeholder="例如：华为" /></label>
            <label><span>岗位名称</span><input id="role" placeholder="例如：产品经理" /></label>
            <label><span>公司性质</span><input id="companyType" placeholder="国企 / 民企 / 外企" /></label>
            <label class="applied-only"><span>工作地点</span><input id="city" placeholder="城市或办公地" /></label>
            <label class="applied-only"><span>投递日期</span><input id="applicationDate" type="date" /></label>
            <label class="applied-only"><span>当前进度</span><select id="status"></select></label>
            <label class="applied-only" id="deadlineField" hidden><span id="deadlineLabel">节点时间 <b>*</b></span><input id="assessmentDeadline" type="datetime-local" /><small id="deadlineHint">当前进度需要填写对应时间</small></label>
            <label class="applied-only"><span>投递渠道</span><input id="channel" placeholder="官网 / 内推 / 招聘平台" /></label>
            <label class="applied-only"><span>岗位期望值</span><select id="preference"><option value="">未评分</option><option>1分</option><option>2分</option><option>3分</option><option>4分</option><option>5分</option></select></label>
            <label class="applied-only"><span>是否收到面试</span><select id="receivedInterview"><option value="false">否</option><option value="true">是</option></select></label>
            <label class="wide applied-only"><span>岗位链接</span><input id="jobUrl" type="url" placeholder="https://…" /></label>
            <label class="wide applied-only"><span>岗位要求 / JD</span><textarea id="description" rows="4"></textarea></label>
            <label class="wide applied-only"><span>网上面试信息</span><textarea id="interviewInfo" rows="4"></textarea></label>
            <label class="wide applied-only"><span>投递规则</span><textarea id="applicationRule" rows="2"></textarea></label>
            <label class="wide applied-only"><span>我的经历匹配</span><textarea id="experienceSummary" rows="3"></textarea></label>
          </div>
        </div>
        <footer><button type="button" class="secondary" data-close="jobModal">取消</button><button class="primary" type="submit">保存记录</button></footer>
      </form>
    </section>
  </div>

  <div class="modal centered" id="prepModal" hidden>
    <button class="backdrop" data-close="prepModal" aria-label="关闭"></button>
    <section class="dialog" role="dialog" aria-modal="true">
      <header><div><small>INTERVIEW PREP</small><h2>编辑面试素材</h2></div><button class="icon" data-close="prepModal" aria-label="关闭">×</button></header>
      <form id="prepForm">
        <div class="form-scroll single">
          <input type="hidden" id="prepId" />
          <label><span>分类</span><select id="prepCategory"><option value="experience">经历打磨</option><option value="question">常见问题</option><option value="self_intro">自我介绍</option></select></label>
          <label><span>标题 <b>*</b></span><input id="prepTitle" required /></label>
          <label><span>内容</span><textarea id="prepContent" rows="11"></textarea></label>
        </div>
        <footer><button type="button" class="secondary" data-close="prepModal">取消</button><button class="primary" type="submit">保存素材</button></footer>
      </form>
    </section>
  </div>

  <script src="./app.js"></script>
</body>
</html>
