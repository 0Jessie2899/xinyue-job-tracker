<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#6d4a86" />
  <title>Jessie的求职之旅</title>
  <meta name="description" content="个人秋招投递、进度与面试准备台账" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <section class="cover" id="cover" aria-label="Jessie的求职之旅封面">
    <div class="cover-haze"></div>
    <img class="cover-iris" src="./assets/iris-flower.webp" alt="" aria-hidden="true" />
    <div class="cover-panel">
      <span class="cover-mark">J</span>
      <p>2027 CAMPUS RECRUITMENT</p>
      <h1>Jessie的求职之旅</h1>
      <div class="cover-line"></div>
      <button class="cover-cta" id="enterTracker" type="button">开启旅程 <span aria-hidden="true">→</span></button>
    </div>
  </section>

  <div class="shell">
    <img class="ambient-iris" src="./assets/iris-flower.webp" alt="" aria-hidden="true" />
    <aside class="sidebar" id="sidebar">
      <div class="brand"><span>J</span><div><b>Jessie求职台账</b><small>JOB JOURNEY</small></div></div>
      <nav id="nav">
        <button class="active" data-page="dashboard"><i>01</i><span>求职看板</span></button>
        <button data-page="applied"><i>02</i><span>投递记录</span></button>
        <button data-page="wishlist"><i>03</i><span>待投递</span></button>
        <button data-page="prep"><i>04</i><span>面试准备</span></button>
        <button data-page="aiconfig"><i>05</i><span>AI 配置</span></button>
      </nav>
    </aside>

    <main>
      <header class="topbar">
        <button class="menu-button" id="menuButton" aria-label="打开菜单">☰</button>
        <h1 id="pageTitle">求职看板</h1>
        <div class="profile"><span>J</span><div><b>Jessie</b><small>个人求职空间</small></div></div>
      </header>
      <div id="notice" class="notice" hidden aria-live="polite"></div>
      <div id="app" class="content"><div class="loading">正在加载台账数据…</div></div>
    </main>
  </div>

  <nav class="bottom-nav" id="bottomNav">
    <button class="active" data-page="dashboard"><i>01</i><span>看板</span></button>
    <button data-page="applied"><i>02</i><span>投递</span></button>
    <button data-page="wishlist"><i>03</i><span>待投</span></button>
    <button data-page="prep"><i>04</i><span>准备</span></button>
    <button data-page="aiconfig"><i>05</i><span>配置</span></button>
  </nav>

  <div class="modal" id="jobModal" hidden>
    <button class="backdrop" data-close="jobModal" aria-label="关闭"></button>
    <section class="drawer" role="dialog" aria-modal="true" aria-labelledby="jobModalTitle">
      <header><div><small id="jobModalKicker">JOB RECORD</small><h2 id="jobModalTitle">新增投递</h2></div><button class="icon" data-close="jobModal" aria-label="关闭">×</button></header>
      <form id="jobForm">
        <div class="form-scroll">
          <input type="hidden" id="jobId" />
          <div class="form-grid">
            <label><span>公司名称 <b>*</b></span><input id="company" required placeholder="例如：华为" /></label>
            <label><span>岗位名称</span><input list="roleOptions" id="role" placeholder="例如：产品经理" /></label>
            <label><span>公司性质</span><select id="companyType"><option value="">请选择</option><option>民企</option><option>国企</option><option>央企</option><option>外企</option><option>合资企业</option><option>事业单位</option><option>社会组织</option><option>其他</option></select></label>
            <label class="applied-only"><span>公司行业</span><select id="industry"><option value="">请选择</option><option>互联网 / 软件服务</option><option>人工智能</option><option>电子 / 半导体</option><option>通信</option><option>汽车 / 新能源汽车</option><option>制造业 / 工业设备</option><option>能源 / 电力</option><option>金融</option><option>物流 / 供应链</option><option>零售 / 电商</option><option>快消 / 食品饮料</option><option>农林牧渔</option><option>医药 / 医疗健康</option><option>房地产 / 商业管理</option><option>咨询 / 专业服务</option><option>教育 / 培训</option><option>文化 / 传媒 / 娱乐</option><option>旅游 / 酒店</option><option>公共服务</option><option>综合集团</option><option>其他</option></select></label>
          <label class="applied-only"><span>工作地点</span><input list="cityOptions" id="city" placeholder="城市或办公地" /></label>
            <label class="applied-only"><span>投递日期</span><input id="applicationDate" type="date" /></label>
            <label class="applied-only"><span>当前进度</span><select id="status"></select></label>
            <label class="applied-only" id="deadlineField" hidden><span id="deadlineLabel">节点时间 <b>*</b></span><input id="assessmentDeadline" type="datetime-local" /><small id="deadlineHint">当前进度需要填写对应时间</small></label>
            <label class="wide applied-only" id="failReasonField" hidden><span>挂掉 / 终止原因 <b>*</b></span><input id="failReason" placeholder="例如：简历未通过初筛、岗位已招满、主动放弃" /><small>记录原因便于后续复盘</small></label>
            <label class="applied-only" id="nextStageField" hidden><span>下一节点</span><select id="nextStage"></select><small>保存后自动推进到该状态</small></label>
            <label class="applied-only" id="nextStageTimeField" hidden><span>下一节点时间 <b>*</b></span><input id="nextStageTime" type="datetime-local" /><small id="nextStageTimeHint"></small></label>
            <label class="applied-only"><span>投递渠道</span><select id="channel"><option value="">请选择</option><option>公司官网</option><option>内推</option><option>BOSS直聘</option><option>智联招聘</option><option>前程无忧</option><option>猎聘</option><option>牛客</option><option>应届生求职网</option><option>学校就业网</option><option>校招宣讲会</option><option>校园双选会</option><option>其他</option></select></label>
            <label class="applied-only"><span>岗位期望值</span><select id="preference"><option value="">未评分</option><option>1分</option><option>2分</option><option>3分</option><option>4分</option><option>5分</option></select></label>
            <label class="applied-only"><span>是否收到面试</span><select id="receivedInterview"><option value="false">否</option><option value="true">是</option></select></label>
            <label class="wide applied-only"><span>岗位链接</span><input id="jobUrl" type="url" placeholder="https://…" /></label>
            <label class="wide applied-only"><span>岗位要求 / JD</span><textarea id="description" rows="4"></textarea></label>
            <label class="wide applied-only"><span>网上面试信息</span><textarea id="interviewInfo" rows="4"></textarea></label>
            <label class="wide applied-only"><span>投递规则</span><textarea id="applicationRule" rows="2"></textarea></label>
            <label class="wide applied-only"><span>我的经历匹配</span><textarea id="experienceSummary" rows="3"></textarea></label>
          </div>
        </div>
        <footer><button type="button" class="secondary" data-close="jobModal">取消</button><button class="primary" type="submit">保存记录</button></footer>
      </form>
    </section>
  </div>

  <div class="modal centered" id="prepModal" hidden>
    <button class="backdrop" data-close="prepModal" aria-label="关闭"></button>
    <section class="dialog" role="dialog" aria-modal="true">
      <header><div><small>INTERVIEW PREP</small><h2>编辑面试素材</h2></div><button class="icon" data-close="prepModal" aria-label="关闭">×</button></header>
      <form id="prepForm">
        <div class="form-scroll single">
          <input type="hidden" id="prepId" />
          <label><span>分类</span><select id="prepCategory"><option value="experience">经历打磨</option><option value="question">常见问题</option><option value="self_intro">自我介绍</option></select></label>
          <label><span>标题 <b>*</b></span><input id="prepTitle" required /></label>
          <label class="prep-content"><span>内容</span><textarea id="prepContent" rows="11" placeholder="填写素材内容，或点右下角猫咪图标让 AI 帮你生成"></textarea><button type="button" class="cat-btn" id="prepCatBtn" title="AI 智能生成（炸弹来帮忙）" aria-label="AI 智能生成"><img src="./assets/cat-zhadan.png" srcset="./assets/cat-zhadan@2x.png 2x" alt="" /></button></label>
        </div>
        <footer><button type="button" class="secondary" data-close="prepModal">取消</button><button class="primary" type="submit">保存素材</button></footer>
      </form>
    </section>
  </div>

  <div class="modal centered" id="aiGenModal" hidden>
    <button class="backdrop" data-close="aiGenModal" aria-label="关闭"></button>
    <section class="dialog" role="dialog" aria-modal="true">
      <header><div><small>AI ASSISTANT</small><h2>AI 智能生成</h2></div><button class="icon" data-close="aiGenModal" aria-label="关闭">×</button></header>
      <form id="aiGenForm">
        <div class="form-scroll single">
          <label><span>描述你想要的素材</span><textarea id="aiDesc" rows="4" placeholder="例如：帮我把一段校园项目经历，按 STAR 法打磨成 90 秒面试口述稿"></textarea></label>
          <label><span>关联岗位（可选，自动带入 JD）</span><select id="aiGenJob"><option value="">不关联</option></select></label>
          <div class="ai-actions"><button class="primary" id="aiGenGenerate" type="button">生成素材</button><button class="secondary" id="aiGenCopy" type="button">复制结果</button></div>
          <label><span>生成结果</span><textarea id="aiGenResult" rows="9" placeholder="结果会出现在这里，可编辑后应用到素材"></textarea></label>
          <div class="ai-actions"><button class="primary" id="aiGenSave" type="button">应用到当前素材</button><button class="secondary" id="aiGenCopy2" type="button">复制结果</button></div>
          <p class="ai-note">未配置 Key 时，点击「生成素材」会复制提示词，粘贴到 ChatGPT / 豆包即可。</p>
        </div>
      </form>
    </section>
  </div>

  <script src="./app.js"></script>
<datalist id="cityOptions"><option value="北京"></option><option value="上海"></option><option value="广州"></option><option value="深圳"></option><option value="成都"></option><option value="杭州"></option><option value="南京"></option><option value="武汉"></option><option value="苏州"></option><option value="西安"></option><option value="重庆"></option><option value="天津"></option><option value="长沙"></option><option value="郑州"></option><option value="合肥"></option><option value="厦门"></option><option value="青岛"></option><option value="全国"></option><option value="远程"></option></datalist>
<datalist id="roleOptions"><option value="管培生"></option><option value="产品经理"></option><option value="产品运营"></option><option value="用户运营"></option><option value="市场营销"></option><option value="品牌管理"></option><option value="商务拓展"></option><option value="销售"></option><option value="售前顾问"></option><option value="项目管理"></option><option value="战略规划"></option><option value="行业研究"></option><option value="数据分析"></option><option value="供应链管理"></option><option value="采购"></option><option value="人力资源"></option><option value="财务管理"></option><option value="综合管理"></option></datalist>
</body>
</html>
